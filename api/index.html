<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koyota Proxy</title>

<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#080808;
  --line:#242424;
  --text:#eee;
  --muted:#777;
  --hover:#111;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{
  max-width:980px;
  margin:auto;
  padding:56px 24px 80px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:80px;
}

.brand{
  font-weight:650;
  letter-spacing:-.03em;
  font-size:20px;
}

.status{
  font-size:11px;
  color:#666;
  letter-spacing:.12em;
}

.intro{
  margin-bottom:42px;
}

.eyebrow{
  font-size:11px;
  color:#555;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.intro h1{
  font-size:clamp(36px,7vw,66px);
  line-height:1.05;
  letter-spacing:-.065em;
  font-weight:600;
  margin:14px 0;
}

.intro p{
  color:#777;
  margin:0;
  max-width:460px;
}

.proxy{
  margin-top:48px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:26px 0;
}

.label{
  font-size:11px;
  color:#555;
  letter-spacing:.13em;
  text-transform:uppercase;
  margin-bottom:12px;
}

.row{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  min-width:0;
  height:52px;
  border:1px solid var(--line);
  outline:none;
  background:#080808;
  color:#eee;
  padding:0 16px;
  font:inherit;
}

input::placeholder{
  color:#444;
}

input:focus{
  border-color:#444;
  background:#0a0a0a;
}

button{
  height:52px;
  padding:0 26px;
  border:1px solid #292929;
  background:#eee;
  color:#000;
  cursor:pointer;
  font:600 13px inherit;
  transition:.18s;
}

button:hover{
  background:#fff;
  transform:translateY(-1px);
}

button:active{
  transform:translateY(0);
}

.info{
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-top:12px;
  color:#444;
  font-size:11px;
}

.error{
  color:#888;
  font-size:12px;
  margin-top:12px;
}

.section{
  margin-top:48px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
}

.section h2{
  font-size:12px;
  font-weight:600;
  letter-spacing:.13em;
  text-transform:uppercase;
  margin:0;
}

.item{
  display:flex;
  align-items:center;
  gap:18px;
  padding:19px 0;
  border-bottom:1px solid #171717;
  text-decoration:none;
  color:inherit;
}

.item:hover{
  background:var(--hover);
  padding-left:12px;
  padding-right:12px;
}

.num{
  color:#444;
  width:25px;
}

.item-main{
  flex:1;
  min-width:0;
}

.name{
  font-size:15px;
  font-weight:520;
}

.desc{
  font-size:12px;
  color:#666;
}

.arrow{
  color:#555;
}

.footer{
  margin-top:80px;
  color:#444;
  font-size:11px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}

@media(max-width:520px){
  main{padding:32px 18px 60px}

  .top{margin-bottom:60px}

  .row{flex-direction:column}

  button{width:100%}

  .info{flex-direction:column;gap:2px}
}
</style>
</head>

<body>

<main>

<header class="top">
  <div class="brand">Koyota Proxy</div>
  <div class="status">PROXY / ONLINE</div>
</header>

<section class="intro">

  <div class="eyebrow">HTTP Proxy</div>

  <h1>Browse freely.</h1>

  <p>
    Enter a destination URL and open it through Koyota Proxy.
  </p>

  <div class="proxy">

    <div class="label">Destination</div>

    <div class="row">

      <input
        id="url"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="https://example.com"
      >

      <button id="open">
        Open
      </button>

    </div>

    <div class="info">
      <span>HTTP / HTTPS</span>
      <span id="status">READY</span>
    </div>

    <div id="error" class="error" hidden></div>

  </div>

</section>

<section class="section">

  <div class="section-head">
    <h2>Quick access</h2>
  </div>

  <a class="item" href="/https://example.com">
    <span class="num">01</span>
    <span class="item-main">
      <div class="name">Example</div>
      <div class="desc">example.com</div>
    </span>
    <span class="arrow">↗</span>
  </a>

</section>

<footer class="footer">
  <span>Koyota Proxy</span>
  <span>RANDOM URL MODE</span>
</footer>

</main>

<script>
const input=document.getElementById("url");
const button=document.getElementById("open");
const status=document.getElementById("status");
const error=document.getElementById("error");

function openProxy(){

  let value=input.value.trim();

  if(!value){
    error.textContent="Enter a URL.";
    error.hidden=false;
    return;
  }

  if(!/^https?:\/\//i.test(value)){
    value="https://"+value;
  }

  try{
    const u=new URL(value);

    if(u.protocol!=="http:" && u.protocol!=="https:"){
      throw new Error();
    }

    error.hidden=true;
    status.textContent="CREATING URL…";

    /*
     * Go側の /create エンドポイントに
     * URLを渡してランダムURLを生成する。
     */
    fetch("/create?url="+encodeURIComponent(u.href))
      .then(r=>{
        if(!r.ok) throw new Error("create failed");
        return r.json();
      })
      .then(data=>{
        if(!data.url) throw new Error("invalid response");

        status.textContent="OPENING…";
        location.href=data.url;
      })
      .catch(()=>{
        error.textContent="Could not create proxy URL.";
        error.hidden=false;
        status.textContent="ERROR";
      });

  }catch{
    error.textContent="Invalid URL.";
    error.hidden=false;
    status.textContent="ERROR";
  }
}

button.addEventListener("click",openProxy);

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") openProxy();
});
</script>

</body>
</html>
